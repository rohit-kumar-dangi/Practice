<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>To do list</title>
</head>
<body>

    <main>

        <div class="heading">
            <h1>To Do List</h1>
        </div>
        
        <div class="add">
            <input id="add_input" type="text" placeholder="Task">
            <button id="add_btn">ADD</button>
        </div>

        <div class="tasks">
            
            <div class="task">
                <div class="task-p1">
                    <p>Hello</p>
                </div>
                <div class="task-p2">
                    <div class="edit">
                        <button id="edit_btn">Edit</button>
                    </div>
                    <div class="delete">
                        <button id="delete_btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
