<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Login - NeoCampus</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Audiowide&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Reset */
    * {margin:0; padding:0; box-sizing:border-box;}

    body {
      font-family: 'Orbitron', sans-serif;
      background: radial-gradient(circle at top left, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      width: 100%;
      max-width: 450px;
      padding: 40px;
      box-shadow: 0 0 25px rgba(0,255,255,0.1);
      text-align: center;
    }

    .logo-icon {
      font-size: 3rem;
      background: linear-gradient(90deg,#00ffff,#ff00cc);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom: 15px;
    }

    .logo h1 {
      font-family: 'Audiowide', cursive;
      font-size: 2rem;
      background: linear-gradient(90deg,#ff00cc,#00ffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      margin-bottom: 5px;
    }

    .logo p {
      color: rgba(255,255,255,0.6);
      margin-bottom: 30px;
    }

    .form-group {
      text-align:left;
      margin-bottom: 20px;
    }
    .form-group label {
      display:block;
      margin-bottom:8px;
      color:#00ffff;
      font-size:0.9rem;
    }

    .input-with-icon {
      position:relative;
    }
    .input-with-icon i {
      position:absolute;
      left:15px;
      top:50%;
      transform:translateY(-50%);
      color:#00ffff;
    }
    .input-with-icon input {
      width:100%;
      padding:14px 14px 14px 45px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.08);
      color:white;
      font-size:1rem;
      transition:all 0.3s ease;
    }
    .input-with-icon input:focus {
      outline:none;
      border-color:#00ffff;
      box-shadow:0 0 0 3px rgba(0,255,255,0.2);
    }

    .forgot-password {
      text-align:right;
      margin-bottom:20px;
    }
    .forgot-password a {
      color:#00ffff;
      text-decoration:none;
      font-size:0.9rem;
    }
    .forgot-password a:hover {text-decoration:underline;}

    .login-btn {
      width:100%;
      padding:14px;
      background: linear-gradient(90deg,#00ffff,#ff00cc);
      color:#fff;
      border:none;
      border-radius:12px;
      font-size:1.1rem;
      font-weight:600;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 0 20px rgba(0,255,255,0.4);
    }
    .login-btn:hover {
      transform:translateY(-3px);
      box-shadow:0 0 30px rgba(255,0,204,0.6);
    }

    .divider {
      display:flex;
      align-items:center;
      margin:30px 0;
      color:rgba(255,255,255,0.5);
    }
    .divider::before,
    .divider::after {
      content:'';
      flex:1;
      height:1px;
      background:rgba(255,255,255,0.2);
    }
    .divider span {
      padding:0 15px;
      font-size:0.9rem;
    }

    .back-to-home a {
      color:#00ffff;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
      transition:color 0.3s ease;
    }
    .back-to-home a:hover {color:#ff00cc;}

    @media (max-width:480px){
      .login-card{padding:30px 20px;}
      .logo h1{font-size:1.8rem;}
    }
  </style>
</head>
<body>
  
  {% with messages = get_flashed_messages() %}
  {% if messages %}
    <script>
        alert("{{ messages[0] }}");
    </script>
  {% endif %}
  {% endwith %}


  <div class="login-card">
    <div class="logo">
      <div class="logo-icon"> <i class="fas fa-chalkboard-teacher"></i></div>
      <h1>Smart Attendance</h1>
      <p>Teacher Login</p>
    </div>

    <form id="loginForm" method="POST" action="/teacher_login">
      <div class="form-group">
        <label for="username">Email </label>
        <div class="input-with-icon">
          
          <input type="email" id="email" name="email" placeholder="Enter email " required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-with-icon">
          
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>
      </div>

      <div class="forgot-password">
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

  </div>

</body>
</html>
